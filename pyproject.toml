[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-account-google-id"
version = "0.2.0"
description = "Agent Account Google ID — Give Your AI an Identity: controlled sessions, authorized identity references, and browser lifecycle for user-owned agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-account-google-id = "agentguard.cli:main"
agentguard = "agentguard.cli:main"

[tool.setuptools]
packages = ["agentguard", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
