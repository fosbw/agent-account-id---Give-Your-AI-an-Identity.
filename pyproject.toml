[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-local"
version = "0.1.0"
description = "Local timer, observer, policy guardrails, and kill switch for user-owned AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools]
packages = ["agentguard", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
